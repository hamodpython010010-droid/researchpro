<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ResearchPro | منشئ الأبحاث الذكي</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f1f5f9;color:#0f172a;line-height:1.8}header{background:linear-gradient(135deg,#1d4ed8,#4f46e5);color:#fff;padding:22px}.head{max-width:1250px;margin:auto;display:flex;justify-content:space-between;align-items:center}.logo{font-size:28px;font-weight:800}.badge{background:#ffffff22;padding:6px 12px;border-radius:20px}.wrap{max-width:1250px;margin:25px auto;padding:0 16px}.layout{display:grid;grid-template-columns:370px 1fr;gap:22px}.card,.paper{background:#fff;border-radius:18px;box-shadow:0 8px 28px #0f172a12;padding:22px}.card{margin-bottom:18px}.card h2{color:#1d4ed8;margin-top:0}label{display:block;font-weight:700;margin:11px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}textarea{min-height:120px;resize:vertical}button{border:0;border-radius:10px;padding:11px 15px;font:inherit;font-weight:700;cursor:pointer}.primary{width:100%;background:#2563eb;color:#fff;margin-top:15px;padding:14px}.secondary{background:#e2e8f0}.danger{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.status{display:none;padding:12px;border-radius:10px;margin-bottom:12px}.error{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}.loading{display:none;text-align:center;padding:70px}.spinner{width:50px;height:50px;border:5px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;animation:spin 1s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}.empty{text-align:center;color:#64748b;padding:100px 20px}.cover{text-align:center;padding:45px 15px;border-bottom:2px solid #e2e8f0;margin-bottom:25px}.cover h1{color:#1d4ed8;font-size:32px}.paper h2{color:#1d4ed8;border-right:5px solid #2563eb;padding-right:10px;margin-top:32px}.paper h3{color:#334155}.paper p{text-align:justify}.paper table{width:100%;border-collapse:collapse;margin:18px 0}.paper th,.paper td{border:1px solid #cbd5e1;padding:9px}.paper th{background:#eff6ff}.toc{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:15px;margin-bottom:25px}.toc a{display:block;color:#1d4ed8;text-decoration:none}.paper a{color:#1d4ed8;word-break:break-word}@media(max-width:900px){.layout{grid-template-columns:1fr}}@media print{header,.form,.actions,.status,.loading{display:none!important}.wrap{margin:0}.paper{box-shadow:none}}
</style>
</head>
<body>
<header><div class="head"><div class="logo">📚 ResearchPro</div><div class="badge">بحث فعلي على الويب</div></div></header>
<main class="wrap"><div class="layout"><section class="form"><div class="card">
<h2>📝 إنشاء البحث</h2>
<label>موضوع البحث</label><textarea id="prompt" placeholder="مثال: أثر الذكاء الاصطناعي على الأمن السيبراني"></textarea>
<label>اسم الطالب</label><input id="student" placeholder="اسم الطالب">
<label>نوع المؤسسة</label><select id="type"><option value="">اختر النوع</option><option>الجامعات الحكومية</option><option>الجامعات الخاصة</option><option>الجامعات الأهلية</option><option>الجامعات التكنولوجية</option><option>الأكاديميات</option><option>الفروع الدولية</option><option>المعاهد العليا</option></select>
<label>الجامعة / المؤسسة</label><select id="university"><option value="">اختر المؤسسة</option></select>
<label>الكلية</label><select id="college"></select>
<label>القسم</label><select id="department"></select>
<label>المادة</label><select id="subject"></select>
<label>الدكتور / المشرف</label><input id="supervisor" placeholder="اختياري">
<label>الفرقة</label><select id="level"><option>الفرقة الأولى</option><option>الفرقة الثانية</option><option>الفرقة الثالثة</option><option>الفرقة الرابعة</option><option>دراسات عليا</option></select>
<label>طول البحث</label><select id="length"><option>قصير</option><option selected>متوسط</option><option>طويل</option><option>مطول جدًا</option></select>
<label>اللغة</label><select id="language"><option selected>العربية</option><option>English</option></select>
<label>متطلبات إضافية</label><textarea id="requirements" placeholder="مثال: أريد جداول ومقارنة ومراجع حديثة..."></textarea>
<button class="primary" id="go">🚀 ابحث واكتب البحث</button>
</div><div class="card"><h2>⚡ بيعمل إيه؟</h2><p>الطلب يذهب للـBackend، والـBackend يجبر أداة Web Search على البحث في الإنترنت ثم يكتب البحث اعتمادًا على النتائج.</p></div></section>
<section><div class="actions"><button class="secondary" id="copy">📋 نسخ</button><button class="secondary" onclick="window.print()">📄 PDF / طباعة</button><button class="danger" id="clear">🗑 بحث جديد</button></div><div id="status" class="status"></div><div id="loading" class="loading"><div class="spinner"></div><h2>جاري البحث الفعلي...</h2><p>بيبحث في الويب وبيحلل المصادر ويكتب البحث.</p></div><article id="result" class="paper"><div class="empty"><h2>ResearchPro</h2><p>اكتب موضوعك واضغط الزر.</p></div></article></section></div></main>
<script>
const institutions={"الجامعات الحكومية":["جامعة القاهرة","جامعة الإسكندرية","جامعة عين شمس","جامعة أسيوط","جامعة طنطا","جامعة المنصورة","جامعة الزقازيق","جامعة حلوان","جامعة المنيا","جامعة المنوفية","جامعة قناة السويس","جامعة جنوب الوادي","جامعة بني سويف","جامعة الفيوم","جامعة بنها","جامعة كفر الشيخ","جامعة سوهاج","جامعة بورسعيد","جامعة دمنهور","جامعة أسوان","جامعة دمياط","جامعة السويس","جامعة مدينة السادات","جامعة العريش","جامعة الوادي الجديد","جامعة مطروح","جامعة الأقصر","جامعة الغردقة"],"الجامعات الخاصة":["جامعة 6 أكتوبر","جامعة أكتوبر للعلوم الحديثة والآداب","جامعة مصر للعلوم والتكنولوجيا","جامعة مصر الدولية","الجامعة البريطانية في مصر","الجامعة الألمانية بالقاهرة","جامعة المستقبل","جامعة بدر","جامعة النهضة","جامعة الدلتا للعلوم والتكنولوجيا","جامعة فاروس","جامعة سيناء","جامعة حورس","جامعة السلام","جامعة ميريت","جامعة دراية","جامعة سفنكس","جامعة مايو","جامعة الأهرام الكندية","جامعة النيل"],"الجامعات الأهلية":["جامعة الملك سلمان الدولية","جامعة الجلالة","جامعة العلمين الدولية","جامعة المنصورة الجديدة","جامعة مصر للمعلوماتية","جامعة النيل الأهلية","جامعة القاهرة الأهلية","جامعة عين شمس الأهلية","جامعة الإسكندرية الأهلية","جامعة حلوان الأهلية","جامعة بنها الأهلية","جامعة المنوفية الأهلية","جامعة الزقازيق الأهلية","جامعة سوهاج الأهلية","جامعة بني سويف الأهلية","جامعة أسيوط الأهلية","جامعة جنوب الوادي الأهلية","جامعة قناة السويس الأهلية","جامعة الإسماعيلية الجديدة الأهلية","جامعة كفر الشيخ الأهلية","جامعة دمنهور الأهلية","جامعة طنطا الأهلية"],"الجامعات التكنولوجية":["جامعة القاهرة الجديدة التكنولوجية","جامعة بني سويف التكنولوجية","جامعة الدلتا التكنولوجية","جامعة برج العرب التكنولوجية","جامعة 6 أكتوبر التكنولوجية","جامعة طيبة التكنولوجية","جامعة شرق بورسعيد التكنولوجية","جامعة سمنود التكنولوجية","جامعة أسيوط الجديدة التكنولوجية"],"الأكاديميات":["أكاديمية السادات للعلوم الإدارية","الأكاديمية العربية للعلوم والتكنولوجيا والنقل البحري","أكاديمية الشرطة","أكاديمية الفنون","أكاديمية ناصر العسكرية العليا"],"الفروع الدولية":["الجامعة الأمريكية بالقاهرة","الجامعة المصرية اليابانية للعلوم والتكنولوجيا","الجامعة الألمانية الدولية","جامعة هيرتفوردشاير في مصر","جامعة إسلسكا مصر","الجامعة الأوروبية في مصر"],"المعاهد العليا":["المعهد العالي للحاسبات ونظم المعلومات","المعهد العالي للعلوم الإدارية","المعهد العالي للهندسة والتكنولوجيا","معهد الجزيرة العالي للهندسة والتكنولوجيا","معهد المدينة العالي للهندسة والتكنولوجيا","معهد النيل العالي للهندسة والتكنولوجيا","معهد الدلتا العالي للهندسة والتكنولوجيا","المعهد العالي للدراسات المتطورة"]};
const colleges=["كلية الحاسبات والمعلومات","كلية علوم الحاسب وتكنولوجيا المعلومات","كلية الذكاء الاصطناعي","كلية الهندسة","كلية العلوم","كلية التجارة","كلية إدارة الأعمال","كلية الاقتصاد والعلوم السياسية","كلية الحقوق","كلية الآداب","كلية التربية","كلية التربية الرياضية","كلية الإعلام","كلية الطب","كلية الصيدلة","كلية التمريض","كلية الزراعة","كلية السياحة والفنادق"];
const departments={"كلية الحاسبات والمعلومات":["علوم الحاسب","نظم المعلومات","تكنولوجيا المعلومات","الأمن السيبراني","الذكاء الاصطناعي","علوم البيانات","هندسة البرمجيات"],"كلية علوم الحاسب وتكنولوجيا المعلومات":["علوم الحاسب","الأمن السيبراني","تكنولوجيا المعلومات","الذكاء الاصطناعي","علوم البيانات"],"كلية الذكاء الاصطناعي":["الذكاء الاصطناعي","تعلم الآلة","علوم البيانات","الروبوتات"],"كلية الهندسة":["هندسة الحاسبات","هندسة الاتصالات","الهندسة الكهربائية","الهندسة المدنية","الهندسة الميكانيكية"],"كلية التجارة":["المحاسبة","إدارة الأعمال","الاقتصاد","التسويق"],"كلية إدارة الأعمال":["إدارة الأعمال","التسويق","الموارد البشرية","التمويل"]};
const subjects={"علوم الحاسب":["البرمجة","هياكل البيانات","الخوارزميات","قواعد البيانات","نظم التشغيل","شبكات الحاسب","هندسة البرمجيات"],"الأمن السيبراني":["أمن الشبكات","أمن المعلومات","اختبار الاختراق","التشفير","التحليل الجنائي الرقمي","أمن التطبيقات","أمن الحوسبة السحابية"],"الذكاء الاصطناعي":["مقدمة في الذكاء الاصطناعي","تعلم الآلة","التعلم العميق","معالجة اللغة الطبيعية","الرؤية الحاسوبية"],"المحاسبة":["المحاسبة المالية","محاسبة التكاليف","المراجعة","المحاسبة الإدارية"],"إدارة الأعمال":["مبادئ الإدارة","إدارة الموارد البشرية","التسويق","الإدارة الاستراتيجية"]};
const $=id=>document.getElementById(id), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
function fill(id,arr,first="اختر"){ $(id).innerHTML=`<option value="">${first}</option>`+arr.map(x=>`<option>${esc(x)}</option>`).join(""); }
fill("college",colleges,"اختر الكلية");$("type").onchange=()=>fill("university",institutions[$("type").value]||[],"اختر المؤسسة");$("college").onchange=()=>fill("department",departments[$("college").value]||[],"اختر القسم");$("department").onchange=()=>fill("subject",subjects[$("department").value]||[],"اختر المادة");
function msg(t,c){$("status").textContent=t;$("status").className="status "+c;$("status").style.display="block"}function hide(){$("status").style.display="none"}
$("go").onclick=async()=>{const prompt=$("prompt").value.trim();if(!prompt)return msg("اكتب موضوع البحث أولًا.","error");$("loading").style.display="block";$("result").style.display="none";$("go").disabled=true;hide();try{const r=await fetch("/api/generate-research",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt,student:$("student").value,institutionType:$("type").value,university:$("university").value,college:$("college").value,department:$("department").value,subject:$("subject").value,supervisor:$("supervisor").value,academicLevel:$("level").value,length:$("length").value,language:$("language").value,requirements:$("requirements").value})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"فشل إنشاء البحث");render(d.research);msg("✅ تم إنشاء البحث بعد البحث في الويب.","ok")}catch(e){msg("❌ "+e.message,"error")}finally{$("loading").style.display="none";$('result').style.display="block";$('go').disabled=false}};
function render(html){const d=new DOMParser().parseFromString(html,"text/html");d.querySelectorAll("script,style,iframe,object,embed,form,input,button").forEach(x=>x.remove());d.querySelectorAll("*").forEach(el=>[...el.attributes].forEach(a=>{if(a.name.toLowerCase().startsWith("on")||a.value.toLowerCase().includes("javascript:"))el.removeAttribute(a.name)}));const title=d.querySelector("h1")?.textContent||"بحث أكاديمي";const hs=[...d.querySelectorAll("h2")];let toc=hs.length?'<div class="toc"><h2>فهرس البحث</h2>':"";hs.forEach((h,i)=>{h.id="sec"+i;toc+=`<a href="#sec${i}">${esc(h.textContent)}</a>`});if(hs.length)toc+="</div>";const cover=`<div class="cover"><h1>${esc(title)}</h1><p>الطالب: ${esc($("student").value||"غير محدد")}</p><p>${esc($("university").value)} ${esc($("college").value)} ${esc($("department").value)}</p></div>`;$("result").innerHTML=cover+toc+d.body.innerHTML}
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText($("result").innerText);msg("✅ تم نسخ البحث.","ok")}catch{msg("تعذر النسخ.","error")}};$("clear").onclick=()=>{$("prompt").value="";$('requirements').value="";$('result').innerHTML='<div class="empty"><h2>ResearchPro</h2><p>اكتب موضوعك واضغط الزر.</p></div>';hide()};
</script></body></html>
